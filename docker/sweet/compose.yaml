name: core

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    networks:
      - proxy
      - media
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /home/lach/configs/traefik/.env
    volumes:
      - /home/lach/configs/traefik:/etc/traefik
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/lach/configs/beszel-agent:/var/lib/beszel-agent
      - /data/.beszel:/extra-filesystems/sda1__Media:ro
    devices:
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    entrypoint: ["/bin/sh", "-c", "sleep 60 && exec /agent"]
    env_file:
      - /home/lach/configs/beszel-agent/.env

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2
    container_name: homeassistant
    networks:
      - media
      - proxy
    env_file:
      - /home/lach/configs/homeassistant/.env
    volumes:
      - /home/lach/configs/homeassistant:/config
    restart: unless-stopped

  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    env_file:
      - /home/lach/configs/backrest/data/.env
    ports:
      - "100.111.195.102:9898:9898"
    volumes:
      - /home/lach/configs/backrest/data:/data
      - /home/lach/configs/backrest/cache:/cache
      - /home/lach:/source:ro
    restart: unless-stopped
    networks:
      - proxy

  renovate:
    image: renovate/renovate:latest
    container_name: renovate
    env_file:
      - /home/lach/configs/renovate/.env
    volumes:
      - /home/lach/configs/renovate:/config
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    restart: unless-stopped

  habits:
    image: lachlan443/habits:2.3.1
    container_name: habits
    networks:
      - proxy
    volumes:
      - /home/lach/configs/habits:/config
    restart: unless-stopped

  trilium:
    image: triliumnext/trilium:v0.107.0
    container_name: trilium
    restart: unless-stopped
    environment:
      # Needed for the TODO Board ticket-numbering backend script (~runOnChildNoteCreation)
      TRILIUM_SECURITY_BACKEND_SCRIPTING_ENABLED: "true"
    volumes:
      # Unless TRILIUM_DATA_DIR is set, the data will be stored in the "trilium-data" directory in the home directory.
      # This can also be changed with by replacing the line below with `- /path/of/your/choice:/home/node/trilium-data
      - /home/lach/configs/trilium:/home/node/trilium-data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

networks:
  proxy:
    name: proxy
  media:
    name: media

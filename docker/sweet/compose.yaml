name: core

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    networks:
      - proxy
      - media
      - llm
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /home/lach/configs/traefik/.env
    volumes:
      - /home/lach/configs/traefik:/etc/traefik
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    container_name: cloudflared
    networks:
      - proxy
    env_file:
      - /home/lach/configs/cloudflared/.env
    command: tunnel --no-autoupdate run
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:0.18.7-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/lach/configs/beszel-agent:/var/lib/beszel-agent
      - /data/.beszel:/extra-filesystems/sda1__Media:ro
    devices:
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    entrypoint: ["/bin/sh", "-c", "sleep 60 && exec /agent"]
    env_file:
      - /home/lach/configs/beszel-agent/.env

  backup:
    image: lachlan443/backblaze-backup:1.2.0
    container_name: backup
    env_file:
      - /home/lach/configs/backup/.env
    volumes:
      - /home/lach/configs/backup:/config
      - /home/lach/backups:/backups
      - /home/lach:/source:ro
    restart: unless-stopped

  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    env_file:
      - /home/lach/configs/backrest/data/.env
    ports:
      - "100.111.195.102:9898:9898"
    volumes:
      - /home/lach/configs/backrest/data:/data
      - /home/lach/configs/backrest/cache:/cache
      - /home/lach:/source:ro
    restart: unless-stopped
    networks:
      - proxy

  renovate:
    image: renovate/renovate:latest
    container_name: renovate
    env_file:
      - /home/lach/configs/renovate/.env
    volumes:
      - /home/lach/configs/renovate:/config
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    restart: unless-stopped

  habits:
    image: lachlan443/habits:2.3.1
    container_name: habits
    networks:
      - proxy
    volumes:
      - /home/lach/configs/habits:/config
    restart: unless-stopped

  muximux:
    image: ghcr.io/mescon/muximux:3.3.3
    container_name: muximux
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/lach/configs/muximux/data:/app/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    networks:
      - proxy


networks:
  proxy:
    name: proxy
  media:
    name: media
  llm:
    name: llm

name: core

services:
  traefik:
    image: traefik:v3.8
    container_name: traefik
    networks:
      - proxy
      - media
      - socket-proxy
    depends_on:
      - docker-socket-proxy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Plex is host-networked, so Traefik reaches it through the host gateway
      - host.docker.internal:host-gateway
    env_file:
      - /home/lach/configs/traefik/.env
    volumes:
      - /home/lach/configs/traefik:/etc/traefik
      # Shared middlewares (auth) live in git; shadows the host's old dynamic/routes.yml
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped

  # Read-only Docker API for Traefik's Docker provider and the Beszel agent.
  # Only GET /containers, /events, /version, /_ping are allowed; POST (create/start/exec/delete) is denied.
  # Lives on its own network so only Traefik can reach it; port bound to localhost for the host-networked beszel-agent.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    depends_on:
      - docker-socket-proxy
    volumes:
      - /home/lach/configs/beszel-agent:/var/lib/beszel-agent
      - /data/.beszel:/extra-filesystems/sda1__Media:ro
    devices:
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    entrypoint: ["/bin/sh", "-c", "sleep 60 && exec /agent"]
    env_file:
      - /home/lach/configs/beszel-agent/.env

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2
    container_name: homeassistant
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.homeassistant.rule=Host(`hassio.lbanks.dev`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.tls=true
      - traefik.http.routers.homeassistant.middlewares=auth@file
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123
    networks:
      - media
      - proxy
    env_file:
      - /home/lach/configs/homeassistant/.env
    volumes:
      - /home/lach/configs/homeassistant:/config
    restart: unless-stopped

  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backrest.rule=Host(`backrest.sweet.lbanks.dev`)
      - traefik.http.routers.backrest.entrypoints=websecure
      - traefik.http.routers.backrest.tls.certresolver=cloudflare
      - traefik.http.routers.backrest.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.backrest.tls.domains[0].sans=*.lbanks.dev,*.sweet.lbanks.dev
      - traefik.http.routers.backrest.middlewares=auth@file
      - traefik.http.services.backrest.loadbalancer.server.port=9898
    env_file:
      - /home/lach/configs/backrest/data/.env
    ports:
      - "100.111.195.102:9898:9898"
    volumes:
      - /home/lach/configs/backrest/data:/data
      - /home/lach/configs/backrest/cache:/cache
      - /home/lach:/source:ro
    restart: unless-stopped
    networks:
      - proxy

  renovate:
    image: renovate/renovate:latest
    container_name: renovate
    env_file:
      - /home/lach/configs/renovate/.env
    volumes:
      - /home/lach/configs/renovate:/config
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    restart: unless-stopped

  habits:
    image: lachlan443/habits:2.3.1
    container_name: habits
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.habits.rule=Host(`habits.lbanks.dev`)
      - traefik.http.routers.habits.entrypoints=websecure
      - traefik.http.routers.habits.tls=true
      - traefik.http.routers.habits.middlewares=auth@file
      - traefik.http.services.habits.loadbalancer.server.port=7160
    volumes:
      - /home/lach/configs/habits:/config
    restart: unless-stopped

  trilium:
    image: triliumnext/trilium:v0.107.0
    container_name: trilium
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trilium.rule=Host(`notes.lbanks.dev`)
      - traefik.http.routers.trilium.entrypoints=websecure
      - traefik.http.routers.trilium.tls.certresolver=cloudflare
      - traefik.http.routers.trilium.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.trilium.tls.domains[0].sans=*.lbanks.dev
      - traefik.http.services.trilium.loadbalancer.server.port=8080
    restart: unless-stopped
    environment:
      # Needed for the TODO Board ticket-numbering backend script (~runOnChildNoteCreation)
      TRILIUM_SECURITY_BACKEND_SCRIPTING_ENABLED: "true"
    volumes:
      # Unless TRILIUM_DATA_DIR is set, the data will be stored in the "trilium-data" directory in the home directory.
      # This can also be changed with by replacing the line below with `- /path/of/your/choice:/home/node/trilium-data
      - /home/lach/configs/trilium:/home/node/trilium-data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  ntfy:
    image: binwiederhier/ntfy:v2.38.3
    container_name: ntfy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ntfy.rule=Host(`ntfy.sweet.lbanks.dev`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.routers.ntfy.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.ntfy.tls.domains[0].sans=*.lbanks.dev,*.sweet.lbanks.dev
      - traefik.http.services.ntfy.loadbalancer.server.port=80
    command: serve
    # Tailnet-only: lets the other host (and Beszel) publish without DNS/Traefik.
    ports:
      - "100.111.195.102:8081:80"
    environment:
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/ntfy:/etc/ntfy
      - /home/lach/configs/ntfy/cache:/var/cache/ntfy
    restart: unless-stopped
    init: true
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  socket-proxy:
    name: socket-proxy
  proxy:
    name: proxy
  media:
    name: media

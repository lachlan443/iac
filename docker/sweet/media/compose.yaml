name: media

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr
    networks:
      - media
    env_file:
      - /home/lach/configs/sonarr/.env
    volumes:
      - /home/lach/configs/sonarr:/config
      - /data:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: radarr
    networks:
      - media
    env_file:
      - /home/lach/configs/radarr/.env
    volumes:
      - /home/lach/configs/radarr:/config
      - /data:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    networks:
      - media
    env_file:
      - /home/lach/configs/prowlarr2/.env
    volumes:
      - /home/lach/configs/prowlarr2:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.1
    container_name: qbittorrent
    networks:
      - media
    env_file:
      - /home/lach/configs/qBittorrent/.env
    volumes:
      - /home/lach/configs/qBittorrent:/config
      - /data/torrents:/data/torrents:rw
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:v1.85.0
    restart: unless-stopped
    networks:
      - media
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1000:1000
    environment:
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/autobrr:/config

  qui:
    image: ghcr.io/autobrr/qui:v1.28.0
    container_name: qui
    restart: unless-stopped
    networks:
      - media
    volumes:
      - /home/lach/configs/qui:/config
    #environment:
      # Run as this user/group and chown /config (set both or neither).
      # Alternative to the standard "user:" option, see the Permissions docs.
      #PUID: "1000"
      #PGID: "1000"
      # Permission mask for new files and directories, for example 002 for group write
      #UMASK: "002"

  znc:
    image: lscr.io/linuxserver/znc:1.10.2
    container_name: znc
    networks:
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/znc:/config
    restart: unless-stopped


  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.0.3
    container_name: sabnzbd
    networks:
      - media
    env_file:
      - /home/lach/configs/SABnzbd/.env
    volumes:
      - /home/lach/configs/SABnzbd:/config
      - /data/usenet:/data/usenet:rw
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.0
    container_name: recyclarr
    user: 1000:1000
    networks:
      - media
    env_file:
      - /home/lach/configs/recyclarr/.env
    volumes:
      - /home/lach/configs/recyclarr:/config
    restart: unless-stopped

  kometa:
    image: kometateam/kometa:nightly # Previously v2.3.1, switched to nightly to fix letterboxd_list scraping — revert to stable after v2.3.2+ release
    container_name: kometa
    networks:
      - media
    env_file:
      - /home/lach/configs/kometa/.env
    volumes:
      - /home/lach/configs/kometa:/config
    restart: unless-stopped

  disk-stats:
    build: /home/lach/projects/kometa-disk-usage
    container_name: kometa-sidecar-disk-stats
    env_file:
      - /home/lach/configs/kometa/disk-stats.env
    volumes:
      - /home/lach/configs/kometa:/config
      - /data:/data:ro
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:1.43.3
    container_name: plex
    network_mode: host
    env_file:
      - /home/lach/configs/plex/.env
    volumes:
      - /home/lach/configs/plex:/config
      - /data/media/tv:/tv
      - /data/media/movies:/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    networks:
      - media
    env_file:
      - /home/lach/configs/flaresolverr/.env
    restart: unless-stopped

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.9.13
    container_name: cleanuparr
    networks:
      - media
    env_file:
      - /home/lach/configs/cleanuparr/.env
    volumes:
      - /home/lach/configs/cleanuparr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  pulsarr:
    image: lakker/pulsarr:0.15.5
    container_name: pulsarr
    networks:
      - media
    env_file:
      - /home/lach/configs/pulsarr/.env
    volumes:
      - /home/lach/configs/pulsarr:/app/data
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.15.0
    container_name: maintainerr
    user: 1000:1000
    networks:
      - media
    env_file:
      - /home/lach/configs/maintainerr/.env
    volumes:
      - /home/lach/configs/maintainerr:/opt/data
    restart: unless-stopped

  logline:
    build: /home/lach/projects/logline
    container_name: logline
    networks:
      - media
    env_file:
      - /home/lach/configs/logline/.env
    volumes:
      - /home/lach/configs/logline:/config
    restart: unless-stopped

networks:
  media:
    name: media

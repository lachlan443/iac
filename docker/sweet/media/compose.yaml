name: media

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.sonarr.rule=Host(`sonarr.lbanks.dev`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.routers.sonarr.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.sonarr.tls.domains[0].sans=*.lbanks.dev
      - traefik.http.routers.sonarr.middlewares=auth@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      - media
    env_file:
      - /home/lach/configs/sonarr/.env
    volumes:
      - /home/lach/configs/sonarr:/config
      - /data:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3
    container_name: radarr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.radarr.rule=Host(`radarr.lbanks.dev`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.middlewares=auth@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    networks:
      - media
    env_file:
      - /home/lach/configs/radarr/.env
    volumes:
      - /home/lach/configs/radarr:/config
      - /data:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2
    container_name: prowlarr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.lbanks.dev`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.middlewares=auth@file
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    networks:
      - media
    env_file:
      - /home/lach/configs/prowlarr2/.env
    volumes:
      - /home/lach/configs/prowlarr2:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.qbittorrent.rule=Host(`qbit.lbanks.dev`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.routers.qbittorrent.middlewares=auth@file
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8082
    networks:
      - media
    env_file:
      - /home/lach/configs/qBittorrent/.env
    volumes:
      - /home/lach/configs/qBittorrent:/config
      - /data/torrents:/data/torrents:rw
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  autobrr:
    container_name: autobrr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.autobrr.rule=Host(`autobrr.lbanks.dev`)
      - traefik.http.routers.autobrr.entrypoints=websecure
      - traefik.http.routers.autobrr.tls=true
      - traefik.http.routers.autobrr.middlewares=auth@file
      - traefik.http.services.autobrr.loadbalancer.server.port=7474
    image: ghcr.io/autobrr/autobrr:v1.91.1
    restart: unless-stopped
    networks:
      - media
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1000:1000
    environment:
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/autobrr:/config

  qui:
    image: ghcr.io/autobrr/qui:v1.36.1
    container_name: qui
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.qui.rule=Host(`qui.lbanks.dev`)
      - traefik.http.routers.qui.entrypoints=websecure
      - traefik.http.routers.qui.tls=true
      - traefik.http.routers.qui.middlewares=auth@file
      - traefik.http.services.qui.loadbalancer.server.port=7476
    restart: unless-stopped
    networks:
      - media
    volumes:
      - /home/lach/configs/qui:/config
      - /data/torrents:/data/torrents:rw
    #environment:
      # Run as this user/group and chown /config (set both or neither).
      # Alternative to the standard "user:" option, see the Permissions docs.
      #PUID: "1000"
      #PGID: "1000"
      # Permission mask for new files and directories, for example 002 for group write
      #UMASK: "002"

  znc:
    image: lscr.io/linuxserver/znc:1.10.3
    container_name: znc
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.znc.rule=Host(`znc.lbanks.dev`)
      - traefik.http.routers.znc.entrypoints=websecure
      - traefik.http.routers.znc.tls=true
      - traefik.http.routers.znc.middlewares=auth@file
      - traefik.http.services.znc.loadbalancer.server.port=6501
    networks:
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/znc:/config
    restart: unless-stopped


  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.lbanks.dev`)
      - traefik.http.routers.sabnzbd.entrypoints=websecure
      - traefik.http.routers.sabnzbd.tls=true
      - traefik.http.routers.sabnzbd.middlewares=auth@file
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8084
    networks:
      - media
    env_file:
      - /home/lach/configs/SABnzbd/.env
    volumes:
      - /home/lach/configs/SABnzbd:/config
      - /data/usenet:/data/usenet:rw
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1
    container_name: recyclarr
    user: 1000:1000
    networks:
      - media
    env_file:
      - /home/lach/configs/recyclarr/.env
    volumes:
      - /home/lach/configs/recyclarr:/config
    restart: unless-stopped

  kometa:
    image: kometateam/kometa:nightly # Previously v2.3.1, switched to nightly to fix letterboxd_list scraping — revert to stable after v2.3.2+ release
    container_name: kometa
    networks:
      - media
    env_file:
      - /home/lach/configs/kometa/.env
    volumes:
      - /home/lach/configs/kometa:/config
    restart: unless-stopped

  disk-stats:
    build: /home/lach/projects/kometa-disk-usage
    container_name: kometa-sidecar-disk-stats
    env_file:
      - /home/lach/configs/kometa/disk-stats.env
    volumes:
      - /home/lach/configs/kometa:/config
      - /data:/data:ro
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:1.43.5
    container_name: plex
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.plex.rule=Host(`plex.lbanks.dev`)
      - traefik.http.routers.plex.entrypoints=websecure
      - traefik.http.routers.plex.tls=true
      - traefik.http.services.plex.loadbalancer.server.url=http://host.docker.internal:32400
    network_mode: host
    env_file:
      - /home/lach/configs/plex/.env
    volumes:
      - /home/lach/configs/plex:/config
      - /data/media/tv:/tv
      - /data/media/movies:/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    networks:
      - media
    env_file:
      - /home/lach/configs/flaresolverr/.env
    restart: unless-stopped

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.11.1
    container_name: cleanuparr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.lbanks.dev`)
      - traefik.http.routers.cleanuparr.entrypoints=websecure
      - traefik.http.routers.cleanuparr.tls=true
      - traefik.http.routers.cleanuparr.middlewares=auth@file
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
    networks:
      - media
    env_file:
      - /home/lach/configs/cleanuparr/.env
    volumes:
      - /home/lach/configs/cleanuparr:/config
      # Same path as SABnzbd so Orphaned Files can scan /data/usenet/incomplete
      - /data/usenet:/data/usenet:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  pulsarr:
    image: lakker/pulsarr:1.1.2
    container_name: pulsarr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.pulsarr.rule=Host(`pulsarr.lbanks.dev`)
      - traefik.http.routers.pulsarr.entrypoints=websecure
      - traefik.http.routers.pulsarr.tls=true
      - traefik.http.routers.pulsarr.middlewares=auth@file
      - traefik.http.services.pulsarr.loadbalancer.server.port=3003
    networks:
      - media
    env_file:
      - /home/lach/configs/pulsarr/.env
    volumes:
      - /home/lach/configs/pulsarr:/app/data
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.33.0
    container_name: maintainerr
    labels:
      - traefik.enable=true
      - traefik.docker.network=media
      - traefik.http.routers.maintainerr.rule=Host(`maintainerr.lbanks.dev`)
      - traefik.http.routers.maintainerr.entrypoints=websecure
      - traefik.http.routers.maintainerr.tls=true
      - traefik.http.routers.maintainerr.middlewares=auth@file
      - traefik.http.services.maintainerr.loadbalancer.server.port=6246
    user: 1000:1000
    networks:
      - media
    env_file:
      - /home/lach/configs/maintainerr/.env
    volumes:
      - /home/lach/configs/maintainerr:/opt/data
    restart: unless-stopped

  logline:
    build: /home/lach/projects/logline
    container_name: logline
    networks:
      - media
    env_file:
      - /home/lach/configs/logline/.env
    volumes:
      - /home/lach/configs/logline:/config
    restart: unless-stopped

networks:
  media:
    name: media

name: core

services:
  # Read-only Docker API for Traefik's Docker provider and the Beszel agent.
  # Only GET /containers, /events, /version, /_ping are allowed; POST (create/start/exec/delete) is denied.
  # Lives on its own network so only Traefik can reach it; port bound to localhost for the host-networked beszel-agent.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.8
    container_name: traefik
    networks:
      proxy:
        aliases:
          - id.lbanks.dev
          - oauth.lbanks.dev
      socket-proxy:
    depends_on:
      - docker-socket-proxy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /home/lach/configs/traefik/.env
    volumes:
      - /home/lach/configs/traefik:/etc/traefik
      # Shared middlewares (auth) live in git; shadows the host's old dynamic/routes.yml
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped

  coredns:
    image: coredns/coredns:1.15.0
    container_name: coredns
    network_mode: host
    command: -conf /etc/coredns/Corefile
    volumes:
      - /home/lach/configs/coredns:/etc/coredns
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    depends_on:
      - docker-socket-proxy
    volumes:
      - /home/lach/configs/beszel-agent:/var/lib/beszel-agent
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    env_file:
      - /home/lach/configs/beszel-agent/.env

  beszel:
    image: henrygd/beszel:0.21.2
    container_name: beszel
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.beszel.rule=Host(`beszel.lbanks.dev`)
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.routers.beszel.tls=true
      - traefik.http.services.beszel.loadbalancer.server.port=8090
    ports:
      - "8090:8090"
    env_file:
      - /home/lach/configs/beszel/.env
    volumes:
      - /home/lach/configs/beszel:/beszel_data
    restart: unless-stopped
    networks:
      - proxy

  archisteamfarm:
    image: justarchi/archisteamfarm:6.3.11.7
    container_name: asf
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.asf.rule=Host(`asf.lbanks.dev`)
      - traefik.http.routers.asf.entrypoints=websecure
      - traefik.http.routers.asf.tls=true
      - traefik.http.routers.asf.middlewares=auth@file
      - traefik.http.services.asf.loadbalancer.server.port=1242
    env_file:
      - /home/lach/configs/asf/.env
    volumes:
      - /home/lach/configs/asf:/app/config
      - /home/lach/configs/asf/logs:/app/logs
    restart: unless-stopped
    networks:
      - proxy

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.3
    container_name: pocket-id
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.pocket-id.rule=Host(`id.lbanks.dev`)
      - traefik.http.routers.pocket-id.entrypoints=websecure
      - traefik.http.routers.pocket-id.tls.certresolver=cloudflare
      - traefik.http.routers.pocket-id.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.pocket-id.tls.domains[0].sans=*.lbanks.dev
      - traefik.http.services.pocket-id.loadbalancer.server.port=1411
    env_file:
      - /home/lach/configs/pocket-id/.env
    volumes:
      - /home/lach/configs/pocket-id:/app/data
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: [CMD, /app/pocket-id, healthcheck]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

  redis:
    image: redis:8.10.3-alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - /home/lach/configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    container_name: oauth2-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.oauth2-proxy.rule=Host(`oauth.lbanks.dev`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls=true
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
    env_file:
      - /home/lach/configs/oauth2-proxy/.env
    ports:
      # Tailnet-only: sweet's Traefik forwardAuth reaches it here; no public exposure
      - "100.77.186.107:4180:4180"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - proxy

  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backrest.rule=Host(`backrest.sour.lbanks.dev`)
      - traefik.http.routers.backrest.entrypoints=websecure
      - traefik.http.routers.backrest.tls.certresolver=cloudflare
      - traefik.http.routers.backrest.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.backrest.tls.domains[0].sans=*.lbanks.dev,*.sour.lbanks.dev
      - traefik.http.services.backrest.loadbalancer.server.port=9898
    env_file:
      - /home/lach/configs/backrest/.env
    ports:
      - "100.77.186.107:9898:9898"
    volumes:
      - /home/lach/configs/backrest/data:/data
      - /home/lach/configs/backrest/cache:/cache
      - /home/lach:/source:ro
    restart: unless-stopped
    networks:
      - proxy

  ntfy:
    image: binwiederhier/ntfy:v2.38.1
    container_name: ntfy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ntfy.rule=Host(`ntfy.sour.lbanks.dev`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.routers.ntfy.tls.domains[0].main=lbanks.dev
      - traefik.http.routers.ntfy.tls.domains[0].sans=*.lbanks.dev,*.sour.lbanks.dev
      - traefik.http.services.ntfy.loadbalancer.server.port=80
    command: serve
    # Tailnet-only: lets the other host (and Beszel) publish without DNS/Traefik.
    ports:
      - "100.77.186.107:8081:80"
    environment:
      - TZ=Australia/Sydney
    volumes:
      - /home/lach/configs/ntfy:/etc/ntfy
      - /home/lach/configs/ntfy/cache:/var/cache/ntfy
    restart: unless-stopped
    init: true
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  socket-proxy:
    name: socket-proxy
  proxy:
    name: proxy
